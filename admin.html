<h1>Orders Dashboard</h1>

<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRXqV08VcaDScHMuhgZPM26he9FYIrq0s",
  authDomain: "market-55334.firebaseapp.com",
  projectId: "market-55334",
  storageBucket: "market-55334.firebasestorage.app",
  messagingSenderId: "363644741456",
  appId: "1:363644741456:web:d99a9ef726966979016e55"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("orders");
async function loadOrders(){

  alert("Loading orders...");

  const querySnapshot = await getDocs(collection(db, "orders"));

  alert("Orders found: " + querySnapshot.size);

  container.innerHTML = "";

  querySnapshot.forEach(doc => {

    let data = doc.data();

    container.innerHTML += `
      <div style="border:1px solid #ccc; margin:10px; padding:10px;">
        <h3>${data.customer.name}</h3>
        <p>Phone: ${data.customer.phone}</p>
        <p>Address: ${data.customer.address}</p>

        <h4>Items:</h4>

        <ul>
          ${data.items.map(item => `
            <li>${item.name} x${item.qty} = ${item.price * item.qty} RWF</li>
          `).join("")}
        </ul>
      </div>
    `;
  });

}

loadOrders();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>239 Market</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f3f3f3;
    }

    header{
      background:#131921;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
    }

    .search input{
      padding:10px;
      width:300px;
      border:none;
      border-radius:5px;
    }

    .cart{
      cursor:pointer;
      font-size:18px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:20px;
      padding:20px;
    }

    .card{
      background:white;
      border-radius:8px;
      padding:15px;
      text-align:center;
      box-shadow:0 0 5px rgba(0,0,0,0.1);
    }

    .card h3{
      margin-top:0;
    }

    button{
      background:#ff9900;
      border:none;
      padding:10px;
      width:100%;
      cursor:pointer;
      border-radius:5px;
      font-weight:bold;
    }

    #checkout{
      background:white;
      margin:20px;
      padding:20px;
      border-radius:8px;
    }

    #checkout input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:5px;
    }

  </style>
</head>

<body>

<header>

  <div class="logo">239 Market</div>

  <div class="search">
    <input type="text" placeholder="Search products...">
  </div>

  <div class="cart" onclick="openCart()">
    🛒 Cart (<span id="count">0</span>)
  </div>

</header>

<section class="products" id="products"></section>

<div id="checkout">

  <h2>Checkout</h2>

<input type="text" id="name" value="Oltance Kubwimana">

<input type="text" id="phone" value="+250 791898033">

<input type="text" id="address" value="Kigali Rwanda">  

  <button onclick="placeOrder()">Place Order</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRXqV08VcaDScHMuhgZPM26he9FYIrq0s",
  authDomain: "market-55334.firebaseapp.com",
  projectId: "market-55334",
  storageBucket: "market-55334.firebasestorage.app",
  messagingSenderId: "363644741456",
  appId: "1:363644741456:web:d99a9ef726966979016e55",
  measurementId: "G-SJQ68SQW71"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let cart = JSON.parse(localStorage.getItem("cart")) || [];


    const products = [
{
  name:"Phone",
  price:90000,
  image:"images/Phone.jpg"
},
{
  name:"Shoes",
  price:20000,
  image:"images/Shoes.jpg"
},
{
  name:"Watch",
  price:30000,
  image:"images/Watch.jpg"
},
{
  name:"Bag",
  price:40000,
  image:"images/Bag.jpg"
}
];

const container = document.getElementById("products");

function displayProducts(){
<img src="${p.image}"
     style="width:100%;height:180px;object-fit:cover;border-radius:8px;">

<h3>${p.name}</h3>

  products.forEach(p => {

    container.innerHTML += `
  <div class="card">
    <img src="${p.image}"
         style="width:100%;height:180px;object-fit:cover;border-radius:8px;">

    <h3>${p.name}</h3>

    <p>${p.price} RWF</p>

    <button onclick="addToCart('${p.name}', ${p.price})">
      Add to Cart
    </button>
  </div>
`;

  });

}
window.addToCart = function(name, price){

  let item = cart.find(p => p.name === name);

  if(item){

    item.qty += 1;

  }else{

    cart.push({
      name,
      price,
      qty:1
    });

  }

  localStorage.setItem("cart", JSON.stringify(cart));

  updateCartCount();

}

function updateCartCount(){

  let count = cart.reduce((sum, item) => sum + item.qty, 0);

  document.getElementById("count").innerText = count;

}

window.openCart = function(){

  let text = "Your Cart:\n\n";

  let total = 0;

  cart.forEach(item => {

    text += `${item.name} x${item.qty} = ${item.price * item.qty} RWF\n`;

    total += item.price * item.qty;

  });

  text += "\nTotal: " + total + " RWF";

  alert(text);

}

window.placeOrder = async function(){

  let name = document.getElementById("name").value;

  let phone = document.getElementById("phone").value;

  let address = document.getElementById("address").value;

  if(!name || !phone || !address){

    alert("Fill all fields");

    return;

  }

  let order = {

    customer:{
      name,
      phone,
      address
    },

    items:cart,

    createdAt:new Date()

  };

  try{

    await addDoc(collection(db, "orders"), order);

    alert("Order placed successfully!");

    localStorage.removeItem("cart");

    cart = [];

    updateCartCount();

  }catch(error){

    alert(error.message);

  }

}

displayProducts();

updateCartCount();

</script>

</body>
</html>
